name: Host source check

on:
  push:
    branches:
      - main
      - "beta/**"
  pull_request:

jobs:
  host-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FM1 Core API headers
        uses: actions/checkout@v4
        with:
          repository: rgrvmusic/fm1-core
          path: fm1-core
      - name: Compile application sources
        run: |
          cc -std=c11 -Wall -Wextra -Werror -DFM1_HOST_TEST -Ifm1-core/include -Iapp -c app/orch_engine.c -o /tmp/orch_engine.o
          cc -std=c11 -Wall -Wextra -Werror -DFM1_HOST_TEST -Ifm1-core/include -Iapp -c app/fm1_app.c -o /tmp/fm1_app.o
