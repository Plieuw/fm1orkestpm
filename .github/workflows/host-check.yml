name: Host source check

on:
  push:
    branches:
      - main
      - "beta/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  host-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Checkout FM1 Core API headers
        uses: actions/checkout@v4
        with:
          repository: rgrvmusic/fm1-core
          path: fm1-core
      - name: Compile every application source
        run: |
          set -e
          for f in app/*.c; do
            echo "cc $f"
            cc -std=c11 -O2 -Wall -Wextra -Werror -DFM1_HOST_TEST \
               -Ifm1-core/include -Iapp -c "$f" -o "/tmp/$(basename "$f" .c).o"
          done
      - name: Compile the HAWK runtime units (freestanding)
        run: |
          set -e
          for f in runtime/hawk/orch_hawk_bridge.c runtime/hawk/orch_hawk_panel.c; do
            cc -std=c11 -O2 -Wall -Wextra -Werror -Iruntime/hawk -Iapp \
               -c "$f" -o "/tmp/$(basename "$f" .c).o"
          done
      - name: Validate HAWK overlay script
        run: python3 -m py_compile tools/prepare_hawk_runtime.py
      - name: Checkout pinned stable HAWK runtime
        uses: actions/checkout@v4
        with:
          repository: Plieuw/hawk-chua
          ref: e750df6a2e13490a4f01b84d3f9c553f4612163f
          path: hawk-chua
      - name: Apply and validate HAWK source overlay
        run: |
          python3 tools/prepare_hawk_runtime.py "$PWD/hawk-chua"
          grep -q 'orch_hawk_render_q15' hawk-chua/firmware/src/audio.c
          grep -q 'orchestra/orch_hawk_glue.c' hawk-chua/firmware/src/felucca.c
          grep -q 'orch_hawk_main_frame' hawk-chua/firmware/src/main.c
          grep -q 'orch_obj' hawk-chua/tools/build.py
          grep -q 'orch_hawk_init' hawk-chua/firmware/src/main.c
      - name: Run host tests
        run: FM1_CORE="$PWD/fm1-core" sh tests/run_tests.sh
      - name: Measurements
        run: |
          FM1_CORE="$PWD/fm1-core" sh tests/run_measure.sh
          FM1_CORE="$PWD/fm1-core" sh tests/run_measure.sh repeat
      - name: Verify OTA boot-area protection
        run: python3 tools/check_boot_safety.py "$PWD/hawk-chua"

  hawk-target-build:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    env:
      JIELI_TOOLCHAIN: /opt/jieli/toolchain
      AC79_SDK: /opt/ac79-sdk
      FELUCCA_VERSION: orch-0.6.5-beta
      FELUCCA_CPU2: "0"
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates curl xz-utils python3 python3-pil python3-fonttools \
            gcc libc6-dev clang lld >/dev/null
      - uses: actions/checkout@v4
      - name: Checkout pinned stable HAWK runtime
        uses: actions/checkout@v4
        with:
          repository: Plieuw/hawk-chua
          ref: e750df6a2e13490a4f01b84d3f9c553f4612163f
          path: hawk-chua
      - name: Cache JieLi toolchain and AC79 SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/jieli
            /opt/ac79-sdk
          key: orchestral-jieli-ac79-sdk-v1.2.1-2023-12-13
      - name: Install JieLi toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sh hawk-chua/tools/get_toolchain.sh /opt/jieli
          test -x /opt/jieli/toolchain/pi32v2/bin/clang
      - name: Stage pinned AC79 SDK resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          tmp=$(mktemp -d)
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --sparse \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$tmp/sdk" \
            && git -C "$tmp/sdk" sparse-checkout set cpu/wl82/tools \
            || { rm -rf "$tmp/sdk"; git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                   https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$tmp/sdk"; }
          mkdir -p "$AC79_SDK/cpu/wl82/tools/cfg"
          cp "$tmp/sdk/cpu/wl82/tools/uboot.boot" "$tmp/sdk/cpu/wl82/tools/cfg_tool.bin" "$AC79_SDK/cpu/wl82/tools/"
          cp "$tmp/sdk/cpu/wl82/tools/cfg/eq_cfg_hw.bin" "$AC79_SDK/cpu/wl82/tools/cfg/"
          cp "$tmp/sdk/LICENSE"* "$AC79_SDK/" 2>/dev/null || true
          rm -rf "$tmp"
      - name: Apply orchestral runtime overlay
        run: python3 tools/prepare_hawk_runtime.py "$PWD/hawk-chua"
      - name: Build PI32v2 firmware and validate package
        working-directory: hawk-chua
        run: |
          ./build.sh 2>&1 | tee orchestral-target-build.log
          test -s build/felucca.bin
          test -s build/hawk-chua.fwsc
          sha256sum build/felucca.bin build/hawk-chua.fwsc build/loader/ota.bin > build/SHA256SUMS
      - name: Upload FM1 firmware package
        uses: actions/upload-artifact@v4
        with:
          name: fm1-orchestral-0.6.5-beta
          path: |
            hawk-chua/build/felucca.bin
            hawk-chua/build/hawk-chua.fwsc
            hawk-chua/build/loader/ota.bin
            hawk-chua/build/SHA256SUMS
            hawk-chua/orchestral-target-build.log
          if-no-files-found: error
          retention-days: 14

  # A beta branch push publishes its package as a pre-release, so the .fwsc
  # can be downloaded without a GitHub login (artifacts need one). Never on a
  # pull request; never marked as a full release.
  beta-prerelease:
    needs: [host-compile, hawk-target-build]
    if: github.event_name == 'push' && startsWith(github.ref_name, 'beta/0.6')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fm1-orchestral-0.6.5-beta
          path: pkg
      - name: Publish the pre-release v0.6.5-beta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          cd pkg
          ls -R
          # upload-artifact kept the paths under hawk-chua/: build/..., the log
          mv build/hawk-chua.fwsc fm1-orchestral-0.6.5-beta.fwsc
          mv build/felucca.bin felucca.bin
          sha256sum fm1-orchestral-0.6.5-beta.fwsc felucca.bin > SHA256SUMS
          gh release delete v0.6.5-beta --repo "$REPO" --yes --cleanup-tag || true
          gh release create v0.6.5-beta --repo "$REPO" --prerelease \
            --target "$GITHUB_SHA" \
            --title "FM1 Orchestral Engine 0.6.5-beta (untested on hardware)" \
            --notes "Built by CI from ${GITHUB_SHA} on ${GITHUB_REF_NAME}. Host tests pass and the PI32v2 build links; it has NOT been run on an FM-1. Install with HAWK CHUA's tools/fm1_install.py; recovery: OCT- + OCT+ held 5 s enters UBOOT. See docs/BUILD_FIRMWARE.md." \
            fm1-orchestral-0.6.5-beta.fwsc felucca.bin SHA256SUMS orchestral-target-build.log
